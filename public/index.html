<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1f2937" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Säljkartan" />
  <title>Säljkartan Stockholm</title>
  <link rel="stylesheet" href="/vendor/leaflet.css" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <!-- Password gate -->
  <div id="gate" class="gate hidden">
    <form id="gate-form" class="gate-card">
      <h1>Säljkartan</h1>
      <p>Ange lösenordet för att öppna kartan.</p>
      <input id="gate-password" type="password" placeholder="Lösenord" autocomplete="current-password" required />
      <button type="submit">Öppna kartan</button>
      <p id="gate-error" class="gate-error hidden">Fel lösenord, försök igen.</p>
    </form>
  </div>

  <!-- App -->
  <div id="app" class="app hidden">
    <header class="topbar">
      <div class="search-row">
        <input id="search" type="search" placeholder="Sök namn eller adress…" autocomplete="off" />
        <button id="refresh" class="icon-btn" title="Uppdatera" aria-label="Uppdatera">&#x21bb;</button>
      </div>
      <div id="search-results" class="search-results hidden"></div>
      <div class="chips" id="chips">
        <button class="chip active" data-filter="all">Alla <span></span></button>
        <button class="chip" data-filter="none">Ej besökt <span></span></button>
        <button class="chip" data-filter="visited">Besökt <span></span></button>
        <button class="chip" data-filter="avvakta">Avvakta <span></span></button>
        <button class="chip" data-filter="converted">Kund <span></span></button>
      </div>
    </header>

    <button id="kanban-toggle" class="kanban-btn" title="Visa kanban" aria-label="Växla kanban-vy">&#9707;</button>

    <div id="map"></div>
    <div id="kanban-owner-chips" class="chips kanban-owner-chips hidden">
      <button class="chip active" data-owner="all">Alla <span></span></button>
      <button class="chip" data-owner="savas">Savas <span></span></button>
      <button class="chip" data-owner="baran">Baran <span></span></button>
    </div>
    <div id="kanban" class="kanban hidden"></div>

    <button id="leads-toggle" class="leads-btn" title="Leads (restaurangägare)" aria-label="Visa leads">&#128100;</button>
    <button id="permits-toggle" class="permits-btn" title="Nya serveringstillstånd" aria-label="Visa nya serveringstillstånd">&#127869;</button>
    <button id="kpis-toggle" class="kpis-btn" title="Veckomål (KPI)" aria-label="Visa veckomål">&#128202;</button>
    <button id="wishes-toggle" class="wishes-btn" title="Product features" aria-label="Visa product features">&#9733;</button>
    <button id="tasks-toggle" class="tasks-btn" title="Uppgifter" aria-label="Visa uppgifter">&#9776;</button>
    <button id="locate" class="locate-btn" title="Visa min position" aria-label="Visa min position">&#x25C9;</button>

    <!-- Read-only open-task overlay (managed on /admin) -->
    <div id="tasks-panel" class="tasks-panel hidden">
      <div class="tasks-panel-head">
        <h2>Uppgifter</h2>
        <button id="tasks-close" class="sheet-close" aria-label="Stäng">&times;</button>
      </div>
      <div id="tasks-list" class="tasks-list"></div>
    </div>

    <!-- Editable wishlist overlay: features we need in the wild (add/edit/delete/upvote) -->
    <div id="wishes-panel" class="wishes-panel hidden">
      <div class="tasks-panel-head">
        <h2>Product features</h2>
        <button id="wishes-close" class="sheet-close" aria-label="Stäng">&times;</button>
      </div>
      <form id="wishes-add" class="wishes-add">
        <input id="wishes-text" type="text" placeholder="Funktion vi behöver i fält…" maxlength="500" autocomplete="off" required />
        <button type="submit">Lägg till</button>
      </form>
      <div id="wishes-list" class="wishes-list"></div>
    </div>

    <!-- Read-only weekly KPI overlay (targets managed on /admin) -->
    <div id="kpis-panel" class="tasks-panel hidden">
      <div class="tasks-panel-head">
        <h2 id="kpis-week">Veckomål</h2>
        <button id="kpis-close" class="sheet-close" aria-label="Stäng">&times;</button>
      </div>
      <div id="kpis-list" class="tasks-list"></div>
    </div>

    <!-- Read-only static list: places that recently got permission to serve food -->
    <div id="permits-panel" class="tasks-panel hidden">
      <div class="tasks-panel-head">
        <h2>Nya serveringstillstånd</h2>
        <button id="permits-close" class="sheet-close" aria-label="Stäng">&times;</button>
      </div>
      <div id="permits-list" class="permits-list"></div>
    </div>

    <!-- Read-only static list: restaurant-owner leads grouped by likely heritage -->
    <div id="leads-panel" class="tasks-panel hidden">
      <div class="tasks-panel-head">
        <h2>Leads</h2>
        <button id="leads-close" class="sheet-close" aria-label="Stäng">&times;</button>
      </div>
      <div id="leads-list" class="leads-list"></div>
    </div>

    <!-- Bottom sheet -->
    <div id="sheet" class="sheet">
      <div class="sheet-handle"></div>
      <button id="sheet-close" class="sheet-close" aria-label="Stäng">&times;</button>
      <h2 id="sheet-name"></h2>
      <p id="sheet-address" class="muted"></p>
      <p id="sheet-meta" class="meta"></p>
      <p id="sheet-inspection" class="inspection"></p>
      <p id="sheet-contact" class="contact"></p>
      <div class="status-buttons">
        <button data-status="none" class="status-btn st-none">Ej besökt</button>
        <button data-status="visited" class="status-btn st-visited">Besökt</button>
        <button data-status="avvakta" class="status-btn st-avvakta">Avvakta</button>
        <button data-status="converted" class="status-btn st-converted">Kund!</button>
      </div>
      <label class="owner-row">Ägare
        <select id="sheet-owner">
          <option value="">— Ingen ägare —</option>
          <option value="savas">Savas</option>
          <option value="baran">Baran</option>
        </select>
      </label>
      <div class="date-row">
        <label>Besökt den
          <input id="sheet-visited" type="date" />
        </label>
        <label>Återkom den
          <input id="sheet-comeback" type="date" />
        </label>
      </div>
      <input id="sheet-tools" type="text" placeholder="SaaS-verktyg de använder idag (valfritt)" maxlength="300" />
      <textarea id="sheet-notes" placeholder="Anteckningar… (vem du pratade med, nästa steg)" rows="3" maxlength="2000"></textarea>
      <div class="sheet-actions">
        <button id="sheet-cancel" class="cancel-btn">Avbryt</button>
        <span id="save-status" class="save-status"></span>
        <button id="sheet-save" class="save-btn">Spara</button>
      </div>
    </div>

    <div id="toast" class="toast hidden"></div>
  </div>

  <script src="/vendor/leaflet.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
